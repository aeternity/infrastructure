---
# Long snapshot runs outlive the AWS credentials the play started with, so mint new
# ones (Vault STS, controller side) right before each S3 upload.

- name: Mint fresh AWS credentials (Vault STS)
  delegate_to: localhost
  become: false
  ansible.builtin.command: vault write -f -format=json aws/sts/{{ aws_credentials_role }} ttl={{ aws_credentials_ttl }}
  register: aws_sts
  changed_when: false
  no_log: true

- name: Use the fresh AWS credentials
  ansible.builtin.set_fact:
    aws_access_key: "{{ (aws_sts.stdout | from_json).data.access_key }}"
    aws_secret_key: "{{ (aws_sts.stdout | from_json).data.secret_key }}"
    security_token: "{{ (aws_sts.stdout | from_json).data.security_token }}"
  no_log: true
